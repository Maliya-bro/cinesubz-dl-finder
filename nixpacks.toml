[phases.setup]
nixPkgs = ["nodejs", "npm"]
aptPkgs = [
  "wget", "gnupg", "ca-certificates", "libxss1", 
  "libnss3", "libasound2t64", "libatk-bridge2.0-0", 
  "libatk1.0-0", "libcups2t64", "libdbus-1-3", 
  "libdrm2", "libgbm1", "libnspr4", "libpango-1.0-0", 
  "libpangocairo-1.0-0", "libx11-xcb1", "libxcomposite1", 
  "libxdamage1", "libxfixes3", "libxrandr2", 
  "xdg-utils", "xvfb", "curl"
]

[phases.installBrowser]
dependsOn = ["setup"]
cmds = [
  "wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | apt-key add -",
  "sh -c 'echo \"deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main\" >> /etc/apt/sources.list.d/google.list'",
  "apt-get update",
  "apt-get install -y google-chrome-stable"
]

[variables]
CHROME_PATH = "/usr/bin/google-chrome-stable"
PUPPETEER_EXECUTABLE_PATH = "/usr/bin/google-chrome-stable"
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
