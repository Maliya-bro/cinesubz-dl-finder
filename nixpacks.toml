[phases.setup]
aptPkgs = [
  "wget", "gnupg", "ca-certificates", "libgconf-2-4", "libxss1", 
  "libappindicator1", "libindicator7", "libnss3", "libasound2", 
  "libatk-bridge2.0-0", "libatk1.0-0", "libcups2", "libdbus-1-3", 
  "libdrm2", "libgbm1", "libnspr4", "libpango-1.0-0", "libpangocairo-1.0-0", 
  "libx11-xcb1", "libxcomposite1", "libxdamage1", "libxfixes3", 
  "libxrandr2", "xdg-utils", "chromium", "xvfb"
]

[variables]
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
PUPPETEER_EXECUTABLE_PATH = "/usr/bin/chromium"
