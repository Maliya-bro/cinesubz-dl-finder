<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CineSubz Link Resolver</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #090d16; color: #f1f5f9; padding: 20px; }
    .container { max-width: 820px; margin: 0 auto; }
    h1 { text-align: center; color: #38bdf8; margin-bottom: 24px; font-size: 24px; }
    .search-panel { display: flex; gap: 10px; margin-bottom: 24px; }
    input[type="text"] { flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid #1e293b; background: #131b2e; color: #fff; font-size: 15px; outline: none; }
    input[type="text"]:focus { border-color: #38bdf8; }
    button { padding: 12px 24px; background: #0284c7; border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    .card { background: #131b2e; border: 1px solid #1e293b; border-radius: 10px; padding: 14px 18px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .card h3 { font-size: 15px; margin-bottom: 4px; }
    .card p { font-size: 13px; color: #94a3b8; }
    .btn-select { padding: 8px 16px; background: #334155; border-radius: 6px; border: none; color: #38bdf8; cursor: pointer; }
    .btn-select:hover { background: #475569; }
    .modal-qual { background: #131b2e; border: 1px solid #38bdf8; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
    .btn-qual { display: block; width: 100%; text-align: left; padding: 12px 16px; margin-top: 8px; background: #1e293b; border: 1px solid #334155; border-radius: 6px; color: #fff; cursor: pointer; font-size: 14px; }
    .btn-qual:hover { background: #334155; border-color: #38bdf8; }
    .result-box { background: #0b1324; border: 1px solid #10b981; border-radius: 8px; padding: 16px; margin-bottom: 20px; }
    .result-box h3 { color: #10b981; margin-bottom: 12px; font-size: 16px; }
    .result-item { background: #131d33; padding: 10px 14px; border-radius: 6px; margin-bottom: 8px; word-break: break-all; }
    .result-item a { color: #38bdf8; font-size: 13px; text-decoration: none; }
    .result-item a:hover { text-decoration: underline; }
    .logs-panel { background: #050811; border: 1px solid #1e293b; border-radius: 6px; padding: 12px; font-family: monospace; font-size: 12px; color: #64748b; max-height: 160px; overflow-y: auto; margin-top: 10px; }
    .loader { text-align: center; color: #38bdf8; padding: 16px; font-size: 14px; }
    .error-msg { background: #451a1a; color: #f87171; padding: 12px 16px; border-radius: 6px; border: 1px solid #7f1d1d; margin-bottom: 16px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 CineSubz Direct Link Resolver (Native Engine)</h1>

    <div class="search-panel">
      <input type="text" id="query" placeholder="Enter movie title (e.g. Spider-Man, Minions)..." onkeydown="if(event.key==='Enter') searchMovie()">
      <button onclick="searchMovie()">Search</button>
    </div>

    <div id="loaderArea"></div>
    <div id="resultArea"></div>
    <div id="qualityArea"></div>
    <div id="movieList"></div>
  </div>

  <script>
    async function searchMovie() {
      const q = document.getElementById("query").value.trim();
      if (!q) return;

      document.getElementById("loaderArea").innerHTML = '<div class="loader">🔍 Searching CineSubz...</div>';
      document.getElementById("resultArea").innerHTML = "";
      document.getElementById("qualityArea").innerHTML = "";
      document.getElementById("movieList").innerHTML = "";

      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
        const json = await res.json();
        document.getElementById("loaderArea").innerHTML = "";

        if (!json.success || json.data.length === 0) {
          document.getElementById("movieList").innerHTML = '<div class="error-msg">No results found for your query.</div>';
          return;
        }

        let html = '';
        json.data.forEach(item => {
          html += `
            <div class="card">
              <div>
                <h3>${item.title}</h3>
                <p>⭐ IMDb: ${item.imdb || 'N/A'} | 📊 Quality: ${item.quality || 'N/A'}</p>
              </div>
              <button class="btn-select" onclick="getQualities('${encodeURIComponent(item.url)}')">Select</button>
            </div>
          `;
        });
        document.getElementById("movieList").innerHTML = html;
      } catch (e) {
        document.getElementById("loaderArea").innerHTML = `<div class="error-msg">Error: ${e.message}</div>`;
      }
    }

    async function getQualities(encodedUrl) {
      const movieUrl = decodeURIComponent(encodedUrl);
      document.getElementById("loaderArea").innerHTML = '<div class="loader">⏳ Fetching available qualities...</div>';
      document.getElementById("resultArea").innerHTML = "";
      document.getElementById("qualityArea").innerHTML = "";

      try {
        const res = await fetch("/api/movie", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ movieUrl })
        });
        const json = await res.json();
        document.getElementById("loaderArea").innerHTML = "";

        if (!json.success || json.downloadLinks.length === 0) {
          document.getElementById("qualityArea").innerHTML = '<div class="error-msg">No qualities available for this title.</div>';
          return;
        }

        let html = `
          <div class="modal-qual">
            <h3>${json.title}</h3>
            <p style="font-size:13px; font-weight:bold; color:#38bdf8; margin-top:8px;">Choose quality to resolve final link:</p>
        `;

        json.downloadLinks.forEach(item => {
          html += `<button class="btn-qual" onclick="resolveDownloadLink('${encodeURIComponent(item.directUrl)}')">📥 ${item.quality}</button>`;
        });

        html += `</div>`;
        document.getElementById("qualityArea").innerHTML = html;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (e) {
        document.getElementById("loaderArea").innerHTML = `<div class="error-msg">Error: ${e.message}</div>`;
      }
    }

    async function resolveDownloadLink(encodedDirectUrl) {
      const directUrl = decodeURIComponent(encodedDirectUrl);
      document.getElementById("loaderArea").innerHTML = '<div class="loader">⚡ Decrypting stream link from cloud servers...</div>';
      document.getElementById("resultArea").innerHTML = "";

      try {
        const res = await fetch("/api/resolve", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ directUrl })
        });
        const json = await res.json();
        document.getElementById("loaderArea").innerHTML = "";

        if (json.success && json.links.length > 0) {
          let html = `
            <div class="result-box">
              <h3>✅ Direct Stream Links Resolved (${json.server})</h3>
          `;

          json.links.forEach((l) => {
            const isStorage = l.url.includes("cloudflarestorage") || l.url.includes(".mp4");
            const label = isStorage ? "Direct Cloudflare MP4 Stream" : (l.url.includes("telegram") ? "Telegram Bot Link" : "Mirror Link");
            html += `
              <div class="result-item">
                <span style="font-size:11px; color:#10b981; font-weight:bold;">[${label}]</span><br>
                <a href="${l.url}" target="_blank" rel="noopener noreferrer">${l.url}</a>
              </div>
            `;
          });

          if (json.logs && json.logs.length) {
            html += `<div class="logs-panel"><b>Logs:</b><br>${json.logs.join("<br>")}</div>`;
          }

          html += `</div>`;
          document.getElementById("resultArea").innerHTML = html;
        } else {
          let errHtml = `<div class="error-msg">❌ Decryption Failed: ${json.error || 'Unknown error'}</div>`;
          if (json.logs && json.logs.length) {
            errHtml += `<div class="logs-panel"><b>Trace:</b><br>${json.logs.join("<br>")}</div>`;
          }
          document.getElementById("resultArea").innerHTML = errHtml;
        }
      } catch (e) {
        document.getElementById("loaderArea").innerHTML = `<div class="error-msg">Error: ${e.message}</div>`;
      }
    }
  </script>
</body>
</html>
